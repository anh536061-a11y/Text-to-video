[package]
name = "arcreel-desktop"
version = "0.0.1"
description = "ArcReel desktop shell"
authors = ["ArcReel contributors"]
edition = "2021"

[lib]
name = "arcreel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
